<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live TV</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

header{
background:#00897B;
padding:8px;
text-align:center;
font-size:18px;
font-weight:bold;
}

#list{
height:160px;
overflow:hidden;
}

.item{
padding:8px;
border-bottom:1px solid #333;
}

.active{
background:#00BCD4;
color:#000;
font-weight:bold;
}

video{
width:100%;
height:170px;
background:#111;
}

footer{
background:#111;
padding:5px;
font-size:12px;
text-align:center;
}
</style>
</head>

<body>

<header>LIVE TV</header>

<div id="list"></div>

<video id="player" controls autoplay></video>

<footer>
LSK: Refresh | OK: Play | ▲▼ Select
</footer>

<script>

const playlistURL="https://go.skym3u.top/fqha.m3u";

let channels=[];
let selected=0;

async function loadPlaylist(){

try{

const text=await fetch(playlistURL).then(r=>r.text());

const lines=text.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].startsWith("#EXTINF")){

let name=lines[i].split(",")[1];

let url=lines[i+1];

channels.push({
name,
url
});

}

}

render();

}catch(e){

document.getElementById("list").innerHTML=
"<div style='padding:10px'>Failed to load playlist.</div>";

}

}

function render(){

let html="";

channels.forEach((c,i)=>{

html+=`
<div class="item ${i===selected?'active':''}">
${c.name}
</div>
`;

});

document.getElementById("list").innerHTML=html;

}

function play(){

document.getElementById("player").src=
channels[selected].url;

}

document.addEventListener("keydown",e=>{

switch(e.key){

case "ArrowDown":

selected++;

if(selected>=channels.length)selected=0;

render();

break;

case "ArrowUp":

selected--;

if(selected<0)selected=channels.length-1;

render();

break;

case "Enter":

play();

break;

}

});

loadPlaylist();

</script>

</body>
</html>
