<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIVE TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }

    body {
      background-color: #031326;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      height: 38px;
      background: linear-gradient(to right, #0082c8, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header h1 {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-container {
      width: 100%;
      height: 130px;
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px;
    }

    .channel-item {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #b0c4de;
      cursor: pointer;
    }

    .channel-item.selected {
      background-color: #0d3b66;
      color: #ffffff;
      font-weight: bold;
      border-left: 4px solid #00d2ff;
    }

    .status-msg {
      padding: 15px;
      font-size: 12px;
      text-align: center;
      color: #88a0a0;
    }

    .software-keys {
      height: 26px;
      background-color: #020b14;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid #0d2847;
      font-size: 11px;
      color: #00d2ff;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div class="header">
    <h1>LIVE TV</h1>
  </div>

  <div class="content">
    <div class="player-container">
      <video id="video-player" controls autoplay playsinline></video>
    </div>

    <div class="channel-list" id="channel-container">
      <div class="status-msg" id="status">Loading Channel List...</div>
    </div>
  </div>

  <div class="software-keys">
    <span>Reload</span>
    <span>SELECT</span>
    <span>Stop</span>
  </div>

  <script>
    const ORIGINAL_URL = "https://go.skym3u.top/fqha.m3u";
    // Using CORS Proxy to bypass blocking
    const PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(ORIGINAL_URL);

    let channels = [];
    let selectedIndex = 0;

    const videoNode = document.getElementById("video-player");
    const containerNode = document.getElementById("channel-container");
    const statusNode = document.getElementById("status");
    let hls = null;

    async function fetchPlaylist() {
      statusNode.innerText = "Playlist Fetching...";
      
      try {
        let res = await fetch(PROXY_URL);
        if(!res.ok) res = await fetch(ORIGINAL_URL); // Fallback to direct
        
        const text = await res.text();
        parseM3U(text);
      } catch (err) {
        statusNode.innerText = "Error loading playlist. Check network/URL.";
      }
    }

    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      channels = [];
      let currentTitle = "";

      lines.forEach((line) => {
        line = line.trim();
        if (line.startsWith("#EXTINF:")) {
          const parts = line.split(",");
          currentTitle = parts[1] ? parts[1].trim() : "Channel";
        } else if (line && !line.startsWith("#")) {
          channels.push({
            title: currentTitle || "Channel " + (channels.length + 1),
            url: line
          });
          currentTitle = "";
        }
      });

      renderList();
    }

    function renderList() {
      if (channels.length === 0) {
        statusNode.innerText = "No channels found.";
        return;
      }

      containerNode.innerHTML = "";
      channels.forEach((ch, idx) => {
        const item = document.createElement("div");
        item.className = "channel-item" + (idx === selectedIndex ? " selected" : "");
        item.innerText = ch.title;
        
        // Touch Support
        item.onclick = () => {
          selectedIndex = idx;
          updateSelection();
          playChannel(idx);
        };

        containerNode.appendChild(item);
      });

      updateSelection();
    }

    function updateSelection() {
      const items = containerNode.getElementsByClassName("channel-item");
      Array.from(items).forEach((el, i) => {
        if (i === selectedIndex) {
          el.classList.add("selected");
          el.scrollIntoView({ block: "nearest" });
        } else {
          el.classList.remove("selected");
        }
      });
    }

    function playChannel(index) {
      if (!channels[index]) return;
      const streamUrl = channels[index].url;

      if (Hls.isSupported() && streamUrl.includes(".m3u8")) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(videoNode);
        hls.on(Hls.Events.MANIFEST_PARSED, () => videoNode.play());
      } else {
        videoNode.src = streamUrl;
        videoNode.play().catch(e => console.log("Auto-play error", e));
      }
    }

    // Key Navigation Fix for KaiOS / Cloud Phone D-Pad
    document.addEventListener("keydown", (e) => {
      if (channels.length === 0) return;

      switch(e.key) {
        case "ArrowDown":
          if (selectedIndex < channels.length - 1) {
            selectedIndex++;
            updateSelection();
          }
          break;

        case "ArrowUp":
          if (selectedIndex > 0) {
            selectedIndex--;
            updateSelection();
          }
          break;

        case "Enter":
        case "Select":
        case "SoftLeft":
        case "5":
          playChannel(selectedIndex);
          break;
      }
    });

    fetchPlaylist();
  </script>
</body>
</html>
