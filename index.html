<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Phone TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      user-select: none;
    }

    body {
      background-color: #031326;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      height: 38px;
      background: linear-gradient(to right, #0082c8, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-container {
      width: 100%;
      height: 140px;
      background-color: #000;
      flex-shrink: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px;
      background-color: #05192d;
    }

    .channel-item {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #b0c4de;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-item.selected {
      background-color: #0d3b66;
      color: #ffffff;
      font-weight: bold;
      border-left: 4px solid #00d2ff;
    }

    .software-keys {
      height: 26px;
      background-color: #020b14;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid #0d2847;
      font-size: 11px;
      color: #00d2ff;
      flex-shrink: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div class="header">
    <h1>LIVE TV</h1>
  </div>

  <div class="content">
    <div class="player-container">
      <video id="video-player" controls autoplay playsinline></video>
    </div>

    <div class="channel-list" id="channel-container"></div>
  </div>

  <div class="software-keys">
    <span>Up/Down</span>
    <span>SELECT</span>
    <span>Play</span>
  </div>

  <script>
    // অ্যাপ থেকে কপি করা সম্পূর্ণ ফুল লিঙ্কগুলো নিচে কোটেশনের (" ") ভেতরে বসিয়ে দিন
    const channels = [
      { title: "ATN News", url: "https://FULL_URL_HERE_FOR_ATN_NEWS.m3u8" },
      { title: "ATN Bangla", url: "https://FULL_URL_HERE_FOR_ATN_BANGLA.m3u8" },
      { title: "NTV", url: "https://FULL_URL_HERE_FOR_NTV.m3u8" },
      { title: "Bangla Vision", url: "https://FULL_URL_HERE_FOR_BANGLA_VISION.m3u8" },
      { title: "SATV", url: "https://FULL_URL_HERE_FOR_SATV.m3u8" },
      { title: "Channel I HD", url: "https://FULL_URL_HERE_FOR_CHANNEL_I.m3u8" },
      { title: "Deepto TV HD", url: "https://FULL_URL_HERE_FOR_DEEPTO_TV.m3u8" },
      { title: "Maasranga TV", url: "https://FULL_URL_HERE_FOR_MAASRANGA.m3u8" },
      { title: "Channel 9 HD", url: "https://FULL_URL_HERE_FOR_CHANNEL_9.m3u8" },
      { title: "Nexus TV HD", url: "https://FULL_URL_HERE_FOR_NEXUS_TV.m3u8" },
      { title: "Ekattor HD", url: "https://FULL_URL_HERE_FOR_EKATTOR.m3u8" },
      { title: "Bijoy TV", url: "https://FULL_URL_HERE_FOR_BIJOY_TV.m3u8" },
      { title: "Zee Bangla HD", url: "https://FULL_URL_HERE_FOR_ZEE_BANGLA.m3u8" },
      { title: "Sony Aath", url: "https://FULL_URL_HERE_FOR_SONY_AATH.m3u8" },
      { title: "Star Sports 1 HD", url: "https://FULL_URL_HERE_FOR_STAR_SPORTS_1.m3u8" },
      { title: "Star Sports 2 HD", url: "https://FULL_URL_HERE_FOR_STAR_SPORTS_2.m3u8" },
      { title: "T Sports HD", url: "https://FULL_URL_HERE_FOR_T_SPORTS.m3u8" }
    ];

    let selectedIndex = 0;
    const videoNode = document.getElementById("video-player");
    const containerNode = document.getElementById("channel-container");
    let hls = null;

    function renderList() {
      containerNode.innerHTML = "";
      channels.forEach((ch, idx) => {
        const item = document.createElement("div");
        item.className = "channel-item" + (idx === selectedIndex ? " selected" : "");
        item.innerText = (idx + 1) + ". " + ch.title;

        item.onclick = () => {
          selectedIndex = idx;
          updateSelection();
          playChannel(idx);
        };

        containerNode.appendChild(item);
      });

      updateSelection();
    }

    function updateSelection() {
      const items = containerNode.getElementsByClassName("channel-item");
      Array.from(items).forEach((el, i) => {
        if (i === selectedIndex) {
          el.classList.add("selected");
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          el.classList.remove("selected");
        }
      });
    }

    function playChannel(index) {
      if (!channels[index] || !channels[index].url || channels[index].url.includes("FULL_URL_HERE")) return;
      const streamUrl = channels[index].url;

      if (Hls.isSupported() && streamUrl.includes(".m3u8")) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(videoNode);
        hls.on(Hls.Events.MANIFEST_PARSED, () => videoNode.play());
      } else {
        if (hls) hls.destroy();
        videoNode.src = streamUrl;
        videoNode.play().catch(e => console.log("Playback error", e));
      }
    }

        document.addEventListener("keydown", (e) => {
      if (channels.length === 0) return;

      // Down Arrow
      if (e.key === "ArrowDown" || e.keyCode === 40) {
        e.preventDefault();
        if (selectedIndex < channels.length - 1) {
          selectedIndex++;
          updateSelection();
        }
      } 
      // Up Arrow
      else if (e.key === "ArrowUp" || e.keyCode === 38) {
        e.preventDefault();
        if (selectedIndex > 0) {
          selectedIndex--;
          updateSelection();
        }
      } 
      // Select / OK / Enter / Center Key
      else if (
        e.key === "Enter" || 
        e.keyCode === 13 || 
        e.key === "Select" || 
        e.keyCode === 32 || 
        e.key === "SoftLeft" || 
        e.key === "5"
      ) {
        e.preventDefault();
        playChannel(selectedIndex);
      }
    });


    renderList();
  </script>
</body>
</html>
